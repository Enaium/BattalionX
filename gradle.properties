kotlin.code.style=official

# CI runners (7 GB) need more heap for the Kotlin/Native release link of the full game.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.native.jvmArgs=-Xmx5g

# Native targets that cannot run on the current host are expected in a desktop matrix.
kotlin.native.ignoreDisabledTargets=true
