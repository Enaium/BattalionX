name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0). Leave empty to auto-generate v<timestamp>.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Resolve tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="${{ github.event.inputs.version }}"
            if [ -z "$tag" ]; then tag="v$(date +%Y%m%d%H%M%S)"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --generate-notes \
            --repo "$GITHUB_REPOSITORY" || true

  jvm:
    name: Build JVM fat jar
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build fat jar
        run: ./gradlew --no-daemon --stacktrace fatJar
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/libs/*-all.jar dist/BattalionX.jar
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX.jar

  macos:
    name: Build macOS (arm64)
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native executable
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableMacosArm64
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/bin/macosArm64/releaseExecutable/BattalionX.kexe dist/BattalionX-macos-arm64
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-macos-arm64

  macos-x64:
    name: Build macOS (x64)
    needs: create-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native executable
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableMacosX64
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/bin/macosX64/releaseExecutable/BattalionX.kexe dist/BattalionX-macos-x64
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-macos-x64

  linux:
    name: Build Linux (x64)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native executable
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableLinuxX64
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/bin/linuxX64/releaseExecutable/BattalionX.kexe dist/BattalionX-linux-x64
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-linux-x64

  linux-arm64:
    name: Build Linux (arm64)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build native executable
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableLinuxArm64
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/bin/linuxArm64/releaseExecutable/BattalionX.kexe dist/BattalionX-linux-arm64
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-linux-arm64

  windows:
    name: Build Windows (x64)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Build native executable
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableMingwX64
      - name: Stage asset
        run: |
          mkdir -p dist
          cp build/bin/mingwX64/releaseExecutable/BattalionX.exe dist/BattalionX-windows-x64.exe
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-windows-x64.exe

  android:
    name: Build Android APK
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (debug-signed and installable)
        run: ./gradlew --no-daemon --stacktrace :androidApp:assembleDebug
      - name: Stage asset
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk dist/BattalionX-android.apk
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: dist/BattalionX-android.apk
